<div class="container-fluid py-4">

	<!-- ==============================================================
       Header Card (title + action buttons)
  ============================================================== -->
	<div class="card shadow-sm border-0 mb-4">
		<!-- HEADER: title + actions ----------------------------------------- -->
		<div class="card-header bg-white d-flex justify-content-between align-items-center p-3">
			<h5 class="mb-0 h6 text-dark">Edit or Run Workflow</h5>

			<!-- Action form (right-hand side) -->
			<form class="d-flex align-items-end" #wfForm="ngForm">

				<!-- Log level selector - only for existing workflows -->
				@if (!isNew) {
					<label for="logLevel" class="col-form-label me-3 text-muted fs-6">Log at</label>
					<div class="me-5">
						<select id="logLevel" name="logLevel" class="form-select bg-opacity-75" [(ngModel)]="logLevel"
							aria-label="Log level">
							<option>Trace</option>
							<option>Debug</option>
							<option>Info</option>
							<option>Warn</option>
							<option>Error</option>
						</select>
					</div>
				}

				<!-- Run button - only for existing workflows -->
				@if (!isNew) {
					<button type="button" id="runButton" class="btn btn-success me-2 px-4" (click)="runWorkflow()">
						<i class="bi bi-play"></i>
					</button>
				}

				<!-- Upload button - only for new workflows -->
				@if (isNew) {
					<button type="button" id="uploadButton" class="btn btn-primary me-2"
						(click)="showUploadWorkflowDialog()">
						<i class="bi bi-upload"></i>
					</button>
				}

				<!-- Save / Cancel -->
				<button type="button" id="submitButton" class="btn btn-primary me-2" (click)="updateWorkflow()"
					[disabled]="!isNew && (!workflow || !workflow.owned)">
					<i class="bi bi-floppy"></i>
				</button>

				<button type="button" id="cancelButton" class="btn btn-danger" (click)="cancel()">
					<i class="bi bi-x-lg"></i>
				</button>
			</form>
		</div> <!-- /.card-header -->

		<!-- BODY: Name + Description form ------------------------------------- -->
		<div class="card-body p-3">
			<form #wfForm2="ngForm" class="w-100">

				<!-- Workflow name -->
				<div class="mb-3">
					<label for="workflowName" class="form-label">Workflow Name</label>
					<input id="workflowName" name="workflowName" type="text" class="form-control bg-opacity-75"
						[(ngModel)]="workflow.name" (ngModelChange)="workflowUpdated($event)">
				</div>

				<!-- Workflow description - at least a few lines tall -->
				<div class="mb-3">
					<label for="workflowDesc" class="form-label">Description</label>
					<textarea id="workflowDesc" name="workflowDesc" rows="4" class="form-control bg-opacity-75"
						[(ngModel)]="workflow.description" (ngModelChange)="workflowUpdated($event)">
					</textarea>
				</div>

			</form>
		</div> <!-- /.card-body -->
	</div> <!-- /.card -->

	<!-- ==============================================================
       Main body - editor area (outside the header card)
  ============================================================== -->
	<section class="card shadow-sm border-0 mb-4">
		<div class="card-body p-2">
			<minty-workflow-editor name="workflowEditor" [ngModel]="workflow" (ngModelChange)="workflowUpdated($event)">
			</minty-workflow-editor>
		</div> <!-- /.card-body -->
	</section>

</div> <!-- /.container-fluid -->

<!-- ==============================================================
     File-upload modal - single ng-container block
   ============================================================== -->
<ng-container *ngIf="uploadDialogVisible">
	<div class="modal-backdrop fade show"></div>
	<div class="modal fade show d-block" tabindex="-1" role="dialog" aria-modal="true" style="display:block;">
		<div class="modal-dialog modal-xl modal-dialog-scrollable">
			<div class="modal-content">

				<!-- Header -->
				<div class="modal-header">
					<h5 class="modal-title">Upload Workflow file</h5>
					<button type="button" class="btn-close" aria-label="Close"
						(click)="uploadDialogVisible = false"></button>
				</div>

				<!-- Body - file input -->
				<div class="modal-body">
					<div class="mb-3">
						<label for="docFile" class="form-label">Choose a workflow file</label>
						<input type="file" id="docFile" class="form-control" (change)="fileSelected($event)">
						@if (fileName) {
							<small class="text-muted d-block mt-2">
								{{ fileName }} (<span>{{ fileSize }}</span> bytes)
							</small>
						}
					</div>
				</div>

				<!-- Footer - actions -->
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary"
						(click)="uploadDialogVisible = false">Cancel</button>
					<button type="button" class="btn btn-primary" (click)="uploadWorkflow()">Done</button>
				</div>

			</div> <!-- /.modal-content -->
		</div> <!-- /.modal-dialog -->
	</div> <!-- /.modal -->
</ng-container>

<!-- Confirmation dialog for unsaved changes -->
<minty-confirmation-dialog [title]="'Abandon Changes'" [message]="'You have unsaved changes. Discard?'"
	[visible]="confirmCancelVisible" (confirm)="confirmCancel()" (cancel)="confirmCancelVisible = false">
</minty-confirmation-dialog>
