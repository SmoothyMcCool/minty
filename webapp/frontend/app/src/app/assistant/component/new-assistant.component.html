<!-- create-assistant.component.html -->
<div class="container-fluid py-4">

	<!-- Page heading -->
	<h5 class="mb-4">Making a new assistant? That's really exciting my guy!</h5>

	<!-- Card that holds the form + editor -->
	<div class="card shadow-sm border-0 mb-4">
		<div class="card-body p-3">

			<!-- Assistant-editor component (the heavy lifting) -->
			<minty-assistant-editor name="assistantEditor" [models]="models" [tools]="tools" [(ngModel)]="assistant">
			</minty-assistant-editor>

			<!-- Action buttons - aligned to the right, with a small top margin -->
			<div class="d-flex justify-content-end mt-4">
				<button type="submit" id="submitButton" class="btn btn-primary me-2" (click)="createAssistant()"
					[disabled]="formInvalid()">
					<i class="bi bi-check-lg"></i> Create
				</button>

				<button type="button" id="cancelButton" class="btn btn-danger" (click)="navigateTo('assistants')">
					<i class="bi bi-arrow-counterclockwise"></i> Cancel
				</button>
			</div>

		</div> <!-- /.card-body -->
	</div> <!-- /.card -->

</div> <!-- /.container-fluid -->
